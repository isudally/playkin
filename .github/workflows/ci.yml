name: CI - Lint and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Check TypeScript
        run: npm run verify:types

      - name: Check independent web TypeScript
        run: npm run verify:types:web

      - name: Build web app
        run: npm run build:web
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Measure web bundle and reject legacy runtime imports
        run: npm run verify:web-bundle

      - name: Scan client bundle for secrets
        run: npm run verify:client-bundle

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser boot
        run: npm run verify:browser
